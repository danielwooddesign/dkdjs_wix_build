# Lint the Velo source on every push to main.
#
# This replaces GitHub's default Node.js starter workflow, which could never
# pass in a Wix repo:
#   - `npm ci` and setup-node's npm cache both require a committed
#     package-lock.json, and it was untracked.
#   - `npm test` fails outright — package.json has no test script.
#   - the `postinstall` hook runs `wix sync-types`, which needs a Wix login
#     that CI does not have. `--ignore-scripts` skips it.
#
# Wix deploys through its own GitHub integration, not through Actions. This
# workflow does not publish anything; it only catches syntax errors before
# they reach the site.

name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run lint
